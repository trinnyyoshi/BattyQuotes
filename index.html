<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Batty Little Blessings</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    width:100vw;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Quicksand',sans-serif;

    background:
        radial-gradient(circle at top,
        #5d4b73 0%,
        #2b2038 40%,
        #17121d 100%);

    color:white;

    position:relative;
}

/* dreamy moving glow */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;

    background:
        radial-gradient(circle,
        rgba(255,192,255,.10) 0%,
        transparent 55%);

    animation: fog 24s linear infinite;
}

@keyframes fog{

    0%{
        transform:translate(-10%,-10%) rotate(0deg);
    }

    100%{
        transform:translate(-20%,-15%) rotate(360deg);
    }
}

/* sparkles */

.sparkle{
    position:absolute;
    font-size:16px;
    color:#ffd9ff;
    opacity:.7;

    animation: twinkle 4s ease-in-out infinite;
}

@keyframes twinkle{

    0%,100%{
        transform:scale(.6);
        opacity:.25;
    }

    50%{
        transform:scale(1.3);
        opacity:1;
    }
}

/* floating bats */

.bat{
    position:absolute;

    opacity:.78;

    filter:
        drop-shadow(0 0 10px rgba(255,192,255,.6))
        drop-shadow(0 0 22px rgba(205,155,255,.25));

    pointer-events:none;

    animation: fly linear infinite;
}

@keyframes fly{

    0%{
        transform:
            translateX(-150px)
            translateY(0px)
            rotate(0deg);
    }

    25%{
        transform:
            translateX(25vw)
            translateY(-20px)
            rotate(-4deg);
    }

    50%{
        transform:
            translateX(50vw)
            translateY(18px)
            rotate(4deg);
    }

    75%{
        transform:
            translateX(75vw)
            translateY(-15px)
            rotate(-3deg);
    }

    100%{
        transform:
            translateX(120vw)
            translateY(10px)
            rotate(2deg);
    }
}

/* quote container */

.container{
    position:relative;
    z-index:5;

    width:min(92%,680px);

    padding:42px;

    border-radius:30px;

    background:rgba(31,22,40,.58);

    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 0 35px rgba(255,182,255,.18),
        inset 0 0 22px rgba(255,255,255,.04);

    text-align:center;
}

.title{
    font-family:'Cormorant Garamond',serif;

    font-size:3.2rem;

    color:#ffc5f2;

    text-shadow:
        0 0 10px rgba(255,182,255,.5);

    margin-bottom:10px;
}

.subtitle{
    color:#e7cfff;

    margin-bottom:28px;

    letter-spacing:1px;
}

.quote{
    font-size:1.45rem;

    line-height:1.9;

    color:#fff5ff;

    margin-bottom:30px;

    min-height:170px;

    text-shadow:
        0 0 10px rgba(255,255,255,.06);
}

.date{
    color:#ffc8e9;

    margin-bottom:10px;

    font-size:1rem;
}

.time{
    color:#ead5ff;

    font-size:1.15rem;
}

.footer{
    margin-top:25px;

    font-size:.9rem;

    color:#d2b4df;
}

/* mobile */

@media(max-width:600px){

    .container{
        padding:28px;
    }

    .title{
        font-size:2.3rem;
    }

    .quote{
        font-size:1.15rem;
        min-height:140px;
    }

}

</style>
</head>

<body>

<!-- sparkles -->

<div class="sparkle" style="top:5%; left:12%;">✦</div>
<div class="sparkle" style="top:15%; left:75%; animation-delay:1s;">✧</div>
<div class="sparkle" style="top:25%; left:92%; animation-delay:2s;">✦</div>
<div class="sparkle" style="top:35%; left:5%; animation-delay:3s;">✧</div>
<div class="sparkle" style="top:48%; left:84%; animation-delay:1.5s;">✦</div>
<div class="sparkle" style="top:60%; left:15%; animation-delay:2.8s;">✧</div>
<div class="sparkle" style="top:70%; left:90%; animation-delay:1.3s;">✦</div>
<div class="sparkle" style="top:82%; left:28%; animation-delay:2.2s;">✧</div>
<div class="sparkle" style="top:90%; left:70%; animation-delay:3.5s;">✦</div>

<!-- LOTS OF FLOATING BATS -->

<div class="bat" style="top:4%; animation-duration:20s; font-size:20px;">🦇</div>

<div class="bat" style="top:10%; animation-duration:28s; animation-delay:-8s; font-size:36px;">🦇</div>

<div class="bat" style="top:16%; animation-duration:18s; animation-delay:-2s; font-size:18px;">🦇</div>

<div class="bat" style="top:22%; animation-duration:34s; animation-delay:-14s; font-size:24px;">🦇</div>

<div class="bat" style="top:30%; animation-duration:22s; animation-delay:-4s; font-size:30px;">🦇</div>

<div class="bat" style="top:38%; animation-duration:26s; animation-delay:-10s; font-size:22px;">🦇</div>

<div class="bat" style="top:46%; animation-duration:16s; animation-delay:-6s; font-size:28px;">🦇</div>

<div class="bat" style="top:52%; animation-duration:38s; animation-delay:-18s; font-size:42px;">🦇</div>

<div class="bat" style="top:58%; animation-duration:21s; animation-delay:-12s; font-size:20px;">🦇</div>

<div class="bat" style="top:64%; animation-duration:27s; animation-delay:-7s; font-size:34px;">🦇</div>

<div class="bat" style="top:72%; animation-duration:19s; animation-delay:-3s; font-size:18px;">🦇</div>

<div class="bat" style="top:78%; animation-duration:30s; animation-delay:-16s; font-size:38px;">🦇</div>

<div class="bat" style="top:84%; animation-duration:24s; animation-delay:-5s; font-size:26px;">🦇</div>

<div class="bat" style="top:90%; animation-duration:32s; animation-delay:-20s; font-size:32px;">🦇</div>

<!-- main content -->

<div class="container">

    <div class="title">
        Batty Little Blessings
    </div>

    <div class="subtitle">
        soft gothic comfort for wandering souls ✨
    </div>

    <div class="quote" id="quote"></div>

    <div class="date" id="date"></div>

    <div class="time" id="time"></div>

    <div class="footer">
        made with moonlight, sparkles, and tiny bats
    </div>

</div>

<script>

/*
The site automatically rotates quotes every day.
Add as many quotes as you want forever.
*/

const quotes = [

"Small steps still count as magic.",

"You survived every difficult day that once felt impossible.",

"Rest is not weakness. Even the moon takes phases.",

"Your softness is not something to apologize for.",

"The world is brighter because you are still in it.",

"You deserve gentle mornings and peaceful nights.",

"Even wilted flowers bloom again with care.",

"You are allowed to grow slowly.",

"Being different is part of your enchantment.",

"One calm breath can change an entire moment.",

"Not every storm comes to destroy you.",

"You are more loved than your mind lets you believe.",

"Some days surviving is the victory.",

"The universe has not given up on you.",

"Quiet people still leave loud magic behind.",

"You do not need permission to exist beautifully.",

"Healing is messy and still worth it.",

"There is tenderness waiting in your future.",

"You are not behind in life.",

"The stars would miss you if you disappeared.",

"Joy can exist beside sadness.",

"Your heart has carried you this far already.",

"Even tired souls deserve beautiful things.",

"Hope can be tiny and still powerful.",

"You are allowed to take up space.",

"Darkness does not erase your light.",

"The fact that you keep trying matters.",

"You are becoming someone your younger self needed.",

"Magic lives in staying alive another day.",

"The night sky never apologizes for being dark."

];

/* quote rotation */

function getQuoteOfTheDay(){

    const today = new Date();

    const start = new Date(today.getFullYear(), 0, 0);

    const diff = today - start;

    const oneDay = 1000 * 60 * 60 * 24;

    const day = Math.floor(diff / oneDay);

    return quotes[day % quotes.length];
}

document.getElementById("quote").innerText =
    `"${getQuoteOfTheDay()}"`;

/* live clock */

function updateTime(){

    const now = new Date();

    const dateOptions = {
        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    };

    document.getElementById("date").innerText =
        now.toLocaleDateString(undefined, dateOptions);

    document.getElementById("time").innerText =
        now.toLocaleTimeString([], {
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit'
        });
}

updateTime();

setInterval(updateTime,1000);

</script>

</body>
</html>
