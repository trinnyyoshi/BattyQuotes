
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17111f">
<title>Little Nightlight 🦇</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: radial-gradient(ellipse at 50% 35%,
    #45304f 0%, #281d33 42%, #100d17 100%);
  color: #f9e8f7;
  font-family: Georgia, serif;
}

.scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
  padding: 18px;
}

/* Glowing moon */
.moon {
  position: absolute;
  width: 190px;
  height: 190px;
  right: -30px;
  top: 5%;
  border-radius: 50%;
  background: #e8c9e9;
  box-shadow: 0 0 35px #d6a8e766,
              0 0 100px #d6a8e733;
  opacity: .8;
}

/* Stars */
.star {
  position: absolute;
  color: #f6c6ee;
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: .35; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* Realistic stylized bat silhouettes */
.bat {
  position: absolute;
  width: 90px;
  height: 48px;
  left: -110px;
  animation: fly var(--speed) linear infinite;
  animation-delay: var(--delay);
  filter: drop-shadow(0 0 7px #d9a4df66);
}

.bat svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

@keyframes fly {
  0% {
    left: -110px;
    translate: 0 0;
  }
  25% { translate: 0 -18px; }
  50% { translate: 0 10px; }
  75% { translate: 0 -12px; }
  100% {
    left: calc(100% + 110px);
    translate: 0 0;
  }
}

/* Main card */
.card {
  position: relative;
  z-index: 5;
  width: min(100%, 590px);
  max-height: 90%;
  overflow: hidden;
  text-align: center;
  padding: clamp(24px, 6vw, 48px) 24px;
  border: 1px solid #d9b0dd66;
  border-radius: 28px;
  background: linear-gradient(
    145deg,
    rgba(35, 25, 45, .94),
    rgba(25, 18, 34, .91)
  );
  box-shadow: 0 15px 60px #09060c99,
              inset 0 0 35px #e4a9ed0c;
}

.eyebrow {
  color: #d6afd9;
  font: 11px Arial, sans-serif;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

h1 {
  font-size: clamp(42px, 10vw, 67px);
  font-weight: normal;
  line-height: .98;
  color: #f1c6eb;
  text-shadow: 0 0 22px #e6a6df55;
}

.decor {
  margin: 22px 0;
  color: #e6b5df;
  letter-spacing: 8px;
  font-size: 15px;
}

.quote {
  font-size: clamp(22px, 5.5vw, 31px);
  line-height: 1.35;
  color: #fff0fb;
  margin: 0 auto 26px;
  max-width: 470px;
}

.date {
  font: 13px Arial, sans-serif;
  color: #d9bfdc;
}

.time {
  margin-top: 8px;
  font: 12px Arial, sans-serif;
  color: #aa91b5;
}

.footer {
  margin-top: 25px;
  font: 10px Arial, sans-serif;
  line-height: 1.6;
  letter-spacing: 1px;
  color: #b39ab9;
}

@media (max-height: 600px) {
  .card { padding: 18px; }
  h1 { font-size: 42px; }
  .decor { margin: 12px 0; }
  .quote { font-size: 20px; margin-bottom: 16px; }
  .footer { margin-top: 14px; }
  .moon { width: 120px; height: 120px; }
}

@media (prefers-reduced-motion: reduce) {
  .bat, .star { animation-play-state: paused; }
}
</style>
</head>

<body>
<div class="scene">

  <div class="moon"></div>

  <span class="star" style="top:12%;left:12%">✦</span>
  <span class="star" style="top:22%;left:78%;animation-delay:1s">✧</span>
  <span class="star" style="top:75%;left:13%;animation-delay:1.5s">✦</span>
  <span class="star" style="top:80%;left:84%;animation-delay:.5s">✧</span>
  <span class="star" style="top:43%;left:7%;animation-delay:2s">✦</span>
  <span class="star" style="top:55%;left:91%;animation-delay:1.2s">✧</span>
  <span class="star" style="top:9%;left:48%;animation-delay:.8s">·</span>

  <!-- Bat silhouettes with pointed ears and scalloped wings -->
  <div class="bat" style="top:18%;--speed:24s;--delay:-4s">
    <svg viewBox="0 0 100 52" aria-hidden="true">
      <path fill="#100b17" d="
        M50 23
        L43 12 L40 22
        C31 15 22 8 8 11
        L18 25 L2 23
        L12 39 L29 32
        L35 42 L43 33
        L50 38
        L57 33 L65 42
        L71 32 L88 39
        L98 23 L82 25
        L92 11
        C78 8 69 15 60 22
        L57 12 Z"/>
      <path fill="#100b17" d="M43 21 Q50 15 57 21 L55 35 Q50 40 45 35Z"/>
      <circle cx="46" cy="25" r="1.3" fill="#efb8eb"/>
      <circle cx="54" cy="25" r="1.3" fill="#efb8eb"/>
    </svg>
  </div>

  <div class="bat" style="top:34%;--speed:31s;--delay:-17s;scale:.7">
    <svg viewBox="0 0 100 52" aria-hidden="true">
      <path fill="#17101f" d="
        M50 23 L43 12 L40 22
        C31 15 22 8 8 11 L18 25 L2 23
        L12 39 L29 32 L35 42 L43 33
        L50 38 L57 33 L65 42 L71 32
        L88 39 L98 23 L82 25 L92 11
        C78 8 69 15 60 22 L57 12Z"/>
      <path fill="#17101f" d="M43 21 Q50 15 57 21 L55 35 Q50 40 45 35Z"/>
      <circle cx="46" cy="25" r="1.3" fill="#efb8eb"/>
      <circle cx="54" cy="25" r="1.3" fill="#efb8eb"/>
    </svg>
  </div>

  <div class="bat" style="top:70%;--speed:28s;--delay:-11s;scale:.85">
    <svg viewBox="0 0 100 52" aria-hidden="true">
      <path fill="#0c0912" d="
        M50 23 L43 12 L40 22
        C31 15 22 8 8 11 L18 25 L2 23
        L12 39 L29 32 L35 42 L43 33
        L50 38 L57 33 L65 42 L71 32
        L88 39 L98 23 L82 25 L92 11
        C78 8 69 15 60 22 L57 12Z"/>
      <path fill="#0c0912" d="M43 21 Q50 15 57 21 L55 35 Q50 40 45 35Z"/>
      <circle cx="46" cy="25" r="1.3" fill="#efb8eb"/>
      <circle cx="54" cy="25" r="1.3" fill="#efb8eb"/>
    </svg>
  </div>

  <main class="card">
    <div class="eyebrow">✧ a tiny light for dark days ✧</div>
    <h1>Little<br>Nightlight</h1>
    <div class="decor">✦ · ✧ · ✦</div>

    <p class="quote" id="quote"></p>

    <div class="date" id="date"></div>
    <div class="time" id="time"></div>

    <div class="footer">
      YOU DON'T HAVE TO HAVE IT ALL FIGURED OUT TONIGHT
    </div>
  </main>
</div>

<script>
const quotes = [
  "Small steps are still steps. You are allowed to move gently.",
  "You made it through every day you once thought you couldn't.",
  "Rest is not giving up. Even the moon disappears for a while.",
  "You do not have to be bright every day to still be a light.",
  "Somewhere ahead is a softer moment you haven't met yet.",
  "You are allowed to exist without proving that you deserve to.",
  "Being a little lost does not mean you are going the wrong way.",
  "Your best can look different every day. It still counts.",
  "Please be patient with the person you are becoming.",
  "Even the darkest night gives the stars room to shine.",
  "One tiny good thing is enough for today.",
  "You are not behind. Your path is your own.",
  "Your softness is a strength, even when the world forgets.",
  "Tomorrow does not need you to solve everything tonight.",
  "You can be tired and hopeful at the same time.",
  "Some days the bravest thing you can do is stay.",
  "Your story is still being written. This page is not the ending.",
  "Be proud of surviving the chapters nobody saw.",
  "Even the smallest spark changes a dark room.",
  "You deserve the kindness you give to everyone else.",
  "Slow growth is still growth.",
  "There is no shame in needing a little extra gentleness today.",
  "You are allowed to take up space exactly as you are.",
  "Not every day needs to be productive to be meaningful.",
  "The fact that you keep trying matters.",
  "Your future self is rooting for you.",
  "You don't have to bloom on anyone else's schedule.",
  "Sometimes making it through the night is enough.",
  "Keep going, little creature. There are beautiful things ahead.",
  "Your heart has carried you far. Let it rest.",
  "Hope can whisper: try again tomorrow.",
  "Nothing about you has to be perfect to be precious.",
  "You can begin again as many times as you need.",
  "Your existence is not an inconvenience.",
  "Today can be gentle, even if yesterday wasn't.",
  "You are worthy on your difficult days, too.",
  "The night is allowed to be quiet. So are you.",
  "One breath. One moment. One little step.",
  "Maybe you're learning a new way to carry yourself.",
  "Find the next little light. You don't need the whole map.",
  "Your pace is valid.",
  "Let today be enough.",
  "Some beautiful things take longer than expected.",
  "You are allowed to celebrate tiny victories.",
  "Life can be moving underneath the surface, even when you feel stuck.",
  "Your kindness matters, especially the kindness you give yourself.",
  "Leave a little room for something unexpectedly wonderful.",
  "You are allowed to start over."
];

// May 13, 2026 is Day 1.
// The quote cannot be changed by the visitor.
// It changes automatically on the next calendar day.
const startDate = new Date(2026, 4, 13);

function updatePage() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dayNumber = Math.floor((today - startDate) / 86400000);
  const quoteIndex = ((dayNumber % quotes.length) + quotes.length) % quotes.length;

  document.getElementById("quote").textContent =
    "“" + quotes[quoteIndex] + "”";

  document.getElementById("date").textContent =
    now.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });

  document.getElementById("time").textContent =
    now.toLocaleTimeString(undefined, {
      hour: "numeric",
      minute: "2-digit"
    });
}

updatePage();
setInterval(updatePage, 1000);
</script>
</body>
</html>
