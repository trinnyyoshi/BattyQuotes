<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Batty Little Blessings</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    width:100vw;
    font-family:'Quicksand',sans-serif;
    background:
        radial-gradient(circle at top, #4d3a69 0%, #221829 45%, #120f17 100%);
    color:#ffe8ff;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* floating glow */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
        radial-gradient(circle, rgba(255,182,255,0.10) 0%, transparent 50%);
    animation: drift 18s linear infinite;
}

@keyframes drift{
    from{transform:translate(-10%,-10%) rotate(0deg);}
    to{transform:translate(-20%,-15%) rotate(360deg);}
}

/* sparkles */
.sparkle{
    position:absolute;
    color:#ffd8ff;
    font-size:14px;
    opacity:.8;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{
        transform:scale(.7);
        opacity:.3;
    }
    50%{
        transform:scale(1.3);
        opacity:1;
    }
}

/* bats */
.bat{
    position:absolute;
    font-size:28px;
    opacity:.8;
    animation: fly linear infinite;
    filter:drop-shadow(0 0 8px rgba(255,192,255,.5));
}

@keyframes fly{
    from{
        transform:translateX(-120px) translateY(0px);
    }
    to{
        transform:translateX(120vw) translateY(-40px);
    }
}

/* main card */
.container{
    position:relative;
    z-index:10;
    width:min(90%,650px);
    padding:40px;
    border-radius:28px;
    background:rgba(35,25,45,0.55);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 0 35px rgba(255,182,255,.15),
        inset 0 0 25px rgba(255,255,255,.04);
    text-align:center;
}

.title{
    font-family:'Cormorant Garamond',serif;
    font-size:3rem;
    color:#ffc8f5;
    margin-bottom:10px;
    text-shadow:0 0 12px rgba(255,182,255,.5);
}

.subtitle{
    color:#e6c7ff;
    margin-bottom:28px;
    font-size:1rem;
    letter-spacing:1px;
}

.quote{
    font-size:1.4rem;
    line-height:1.8;
    color:#fff2ff;
    margin-bottom:28px;
    min-height:150px;
    text-shadow:0 0 8px rgba(255,255,255,.08);
}

.date{
    color:#ffc8e8;
    font-size:1rem;
    margin-bottom:8px;
}

.time{
    color:#e7d0ff;
    font-size:1.1rem;
}

.footer{
    margin-top:22px;
    font-size:.85rem;
    color:#caa6d8;
}

/* mobile */
@media(max-width:600px){

    .container{
        padding:28px;
    }

    .title{
        font-size:2.2rem;
    }

    .quote{
        font-size:1.15rem;
    }
}
</style>
</head>

<body>

<!-- sparkles -->
<div class="sparkle" style="top:10%; left:15%;">✦</div>
<div class="sparkle" style="top:22%; left:80%; animation-delay:1s;">✧</div>
<div class="sparkle" style="top:75%; left:20%; animation-delay:2s;">✦</div>
<div class="sparkle" style="top:60%; left:90%; animation-delay:1.5s;">✧</div>
<div class="sparkle" style="top:40%; left:5%; animation-delay:3s;">✦</div>

<!-- bats -->
<div class="bat" style="top:15%; animation-duration:24s;">🦇</div>
<div class="bat" style="top:38%; animation-duration:18s; animation-delay:-6s;">🦇</div>
<div class="bat" style="top:68%; animation-duration:28s; animation-delay:-12s;">🦇</div>

<div class="container">

    <div class="title">Batty Little Blessings</div>

    <div class="subtitle">
        soft gothic comfort for wandering souls ✨
    </div>

    <div class="quote" id="quote"></div>

    <div class="date" id="date"></div>
    <div class="time" id="time"></div>

    <div class="footer">
        made with moonlight, sparkles, and tiny bats
    </div>

</div>

<script>

/*
You can keep adding quotes forever.
The site automatically picks a different one every day.
*/

const quotes = [

"Small steps still count as magic.",
"You survived every difficult day that once felt impossible.",
"Rest is not weakness. Even the moon takes phases.",
"Your softness is not something to apologize for.",
"The world is brighter because you are still in it.",
"You deserve gentle mornings and peaceful nights.",
"Even wilted flowers bloom again with care.",
"You are allowed to grow slowly.",
"Being different is part of your enchantment.",
"One calm breath can change an entire moment.",
"Not every storm comes to destroy you.",
"You are more loved than your mind lets you believe.",
"Some days surviving is the victory.",
"The universe has not given up on you.",
"Quiet people still leave loud magic behind.",
"You do not need permission to exist beautifully.",
"Healing is messy and still worth it.",
"There is tenderness waiting in your future.",
"You are not behind in life.",
"The stars would miss you if you disappeared.",
"Joy can exist beside sadness.",
"Your heart has carried you this far already.",
"Even tired souls deserve beautiful things.",
"Hope can be tiny and still powerful.",
"You are allowed to take up space.",
"Darkness does not erase your light.",
"The fact that you keep trying matters.",
"You are becoming someone your younger self needed.",
"Magic lives in staying alive another day.",
"The night sky never apologizes for being dark."

];

// Pick quote based on day of year
function getQuoteOfTheDay(){

    const today = new Date();

    const start = new Date(today.getFullYear(), 0, 0);

    const diff = today - start;

    const oneDay = 1000 * 60 * 60 * 24;

    const day = Math.floor(diff / oneDay);

    return quotes[day % quotes.length];
}

document.getElementById("quote").innerText =
    `"${getQuoteOfTheDay()}"`;

function updateTime(){

    const now = new Date();

    const dateOptions = {
        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    };

    document.getElementById("date").innerText =
        now.toLocaleDateString(undefined, dateOptions);

    document.getElementById("time").innerText =
        now.toLocaleTimeString([], {
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit'
        });
}

updateTime();

setInterval(updateTime,1000);

</script>

</body>
</html>
