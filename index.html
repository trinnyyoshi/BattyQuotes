<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no"/>

<title>Batty Little Blessings</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    position:fixed;

    touch-action:none;
}

body{

    font-family:'Fredoka',sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at top,
        #c9a7ff 0%,
        #9d7ae6 28%,
        #6d57a8 58%,
        #34244f 100%);

    overflow:hidden;

    color:white;
}

/* dreamy background glow */

body::before{

    content:"";

    position:absolute;

    width:180%;
    height:180%;

    background:
        radial-gradient(circle,
        rgba(255,255,255,.12) 0%,
        transparent 60%);

    animation: glowFloat 30s linear infinite;
}

@keyframes glowFloat{

    from{
        transform:translate(-8%,-8%) rotate(0deg);
    }

    to{
        transform:translate(-16%,-12%) rotate(360deg);
    }
}

/* stars */

.star{

    position:absolute;

    color:#fff4ff;

    opacity:.7;

    animation: twinkle 4s ease-in-out infinite;
}

@keyframes twinkle{

    0%,100%{
        transform:scale(.8);
        opacity:.3;
    }

    50%{
        transform:scale(1.4);
        opacity:1;
    }
}

/* clouds */

.cloud{

    position:absolute;

    background:rgba(255,255,255,.10);

    border-radius:999px;

    filter:blur(3px);
}

/* paka paka bats */

.bat{

    position:absolute;

    width:95px;
    height:95px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    animation: floatBat linear infinite;

    box-shadow:
        0 0 25px rgba(255,182,255,.25);

    z-index:2;
}

/* ears */

.bat::before,
.bat::after{

    content:"";

    position:absolute;

    width:28px;
    height:28px;

    border-radius:8px 8px 2px 2px;

    top:-8px;

    z-index:-1;
}

.bat::before{
    left:10px;
    transform:rotate(-18deg);
}

.bat::after{
    right:10px;
    transform:rotate(18deg);
}

/* wings */

.wing-left,
.wing-right{

    position:absolute;

    width:28px;
    height:38px;

    border-radius:40px;

    top:28px;

    opacity:.9;
}

.wing-left{
    left:-16px;
}

.wing-right{
    right:-16px;
}

/* face */

.face{

    font-size:1.1rem;

    line-height:1.1;

    text-align:center;
}

.fruit{

    margin-top:5px;

    font-size:1.4rem;
}

/* floating motion */

@keyframes floatBat{

    0%{
        transform:
            translateX(-160px)
            translateY(0px)
            rotate(-3deg);
    }

    25%{
        transform:
            translateX(25vw)
            translateY(-14px)
            rotate(3deg);
    }

    50%{
        transform:
            translateX(50vw)
            translateY(10px)
            rotate(-2deg);
    }

    75%{
        transform:
            translateX(75vw)
            translateY(-10px)
            rotate(2deg);
    }

    100%{
        transform:
            translateX(120vw)
            translateY(5px)
            rotate(-2deg);
    }
}

/* card */

.container{

    position:relative;

    z-index:5;

    width:min(92%,680px);

    padding:34px;

    border-radius:36px;

    background:rgba(82,54,120,.45);

    backdrop-filter:blur(18px);

    border:2px solid rgba(255,255,255,.12);

    text-align:center;

    box-shadow:
        0 0 35px rgba(255,182,255,.18),
        inset 0 0 20px rgba(255,255,255,.04);
}

/* title */

.title{

    font-size:3rem;

    color:#ffe3ff;

    margin-bottom:10px;

    text-shadow:
        0 0 12px rgba(255,255,255,.25);
}

.subtitle{

    color:#f7ddff;

    margin-bottom:26px;

    font-size:1rem;
}

/* quote */

.quote{

    font-size:1.35rem;

    line-height:1.8;

    color:white;

    min-height:140px;

    margin-bottom:28px;
}

/* date/time */

.date{

    color:#ffd7f3;

    margin-bottom:8px;
}

.time{

    color:#f3e6ff;

    font-size:1.15rem;
}

/* footer */

.footer{

    margin-top:22px;

    color:#e6c6ff;

    font-size:.85rem;
}

/* mobile */

@media(max-width:600px){

    .container{
        padding:26px;
    }

    .title{
        font-size:2.2rem;
    }

    .quote{
        font-size:1.05rem;
        min-height:120px;
    }

    .bat{
        width:72px;
        height:72px;
    }
}

</style>
</head>

<body>

<!-- MAIN CARD -->

<div class="container">

<div class="title">
Batty Little Blessings
</div>

<div class="subtitle">
tiny fruit bats carrying gentle thoughts ✨
</div>

<div class="quote" id="quote"></div>

<div class="date" id="date"></div>

<div class="time" id="time"></div>

<div class="footer">
pastel skies • sleepy bats • soft healing
</div>

</div>

<script>

const quotes = [

"Small steps still count as magic.",

"You survived every difficult day that once felt impossible.",

"Rest is not weakness. Even the moon takes phases.",

"Your softness is not something to apologize for.",

"The world is brighter because you are still in it.",

"You deserve gentle mornings and peaceful nights.",

"Even wilted flowers bloom again with care.",

"You are allowed to grow slowly.",

"Being different is part of your enchantment.",

"One calm breath can change an entire moment.",

"Not every storm comes to destroy you.",

"You are more loved than your mind lets you believe.",

"Some days surviving is the victory.",

"The universe has not given up on you.",

"Quiet people still leave loud magic behind.",

"You do not need permission to exist beautifully.",

"Healing is messy and still worth it.",

"There is tenderness waiting in your future.",

"You are not behind in life.",

"The stars would miss you if you disappeared.",

"Joy can exist beside sadness.",

"Your heart has carried you this far already.",

"Even tired souls deserve beautiful things.",

"Hope can be tiny and still powerful.",

"You are allowed to take up space.",

"Darkness does not erase your light.",

"The fact that you keep trying matters.",

"You are becoming someone your younger self needed.",

"Magic lives in staying alive another day.",

"The night sky never apologizes for being dark."

];

/* quote of the day */

function getQuoteOfTheDay(){

    const today = new Date();

    const start = new Date(today.getFullYear(),0,0);

    const diff = today - start;

    const oneDay = 1000 * 60 * 60 * 24;

    const day = Math.floor(diff / oneDay);

    return quotes[day % quotes.length];
}

document.getElementById("quote").innerText =
`"${getQuoteOfTheDay()}"`;

/* live time */

function updateTime(){

    const now = new Date();

    const options = {

        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    };

    document.getElementById("date").innerText =
    now.toLocaleDateString(undefined, options);

    document.getElementById("time").innerText =
    now.toLocaleTimeString([],{

        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
    });
}

updateTime();

setInterval(updateTime,1000);

</script>

</body>
</html>
