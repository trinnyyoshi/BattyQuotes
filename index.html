<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Batty Little Blessings</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    touch-action:none;
}

body{

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Nunito',sans-serif;

    background:
        radial-gradient(circle at top,
        #7b5ea7 0%,
        #4c356b 35%,
        #23172f 70%,
        #17111f 100%);

    color:white;

    overflow:hidden;
}

/* dreamy glow background */

body::before{
    content:"";

    position:absolute;

    width:180%;
    height:180%;

    background:
        radial-gradient(circle,
        rgba(255,182,255,.12) 0%,
        transparent 60%);

    animation: floatGlow 28s linear infinite;
}

@keyframes floatGlow{

    from{
        transform:translate(-10%,-10%) rotate(0deg);
    }

    to{
        transform:translate(-20%,-15%) rotate(360deg);
    }
}

/* stars & sparkles */

.sparkle{
    position:absolute;

    color:#ffd8ff;

    animation: twinkle 4s ease-in-out infinite;

    opacity:.75;
}

@keyframes twinkle{

    0%,100%{
        transform:scale(.7);
        opacity:.3;
    }

    50%{
        transform:scale(1.4);
        opacity:1;
    }
}

/* cute fruit bats */

.bat{

    position:absolute;

    pointer-events:none;

    filter:
        drop-shadow(0 0 10px rgba(255,182,255,.45))
        drop-shadow(0 0 20px rgba(255,150,255,.2));

    animation: drift linear infinite;

    opacity:.95;
}

@keyframes drift{

    0%{
        transform:
            translateX(-180px)
            translateY(0px)
            rotate(-3deg);
    }

    25%{
        transform:
            translateX(25vw)
            translateY(-15px)
            rotate(3deg);
    }

    50%{
        transform:
            translateX(50vw)
            translateY(10px)
            rotate(-2deg);
    }

    75%{
        transform:
            translateX(75vw)
            translateY(-12px)
            rotate(2deg);
    }

    100%{
        transform:
            translateX(120vw)
            translateY(5px)
            rotate(-2deg);
    }
}

/* main card */

.container{

    position:relative;
    z-index:5;

    width:min(92%,700px);

    padding:36px;

    border-radius:36px;

    background:rgba(44,28,58,.68);

    backdrop-filter:blur(16px);

    border:2px solid rgba(255,255,255,.10);

    box-shadow:
        0 0 35px rgba(255,182,255,.14),
        inset 0 0 25px rgba(255,255,255,.03);

    text-align:center;
}

/* title */

.title{

    font-family:'Fredoka',sans-serif;

    font-size:3rem;

    color:#ffc6f2;

    margin-bottom:8px;

    text-shadow:
        0 0 12px rgba(255,182,255,.5);
}

.subtitle{

    color:#f0d4ff;

    margin-bottom:28px;

    font-size:1rem;

    letter-spacing:1px;
}

/* quote */

.quote{

    font-size:1.4rem;

    line-height:1.8;

    color:#fff5ff;

    min-height:150px;

    margin-bottom:30px;

    text-shadow:
        0 0 10px rgba(255,255,255,.05);
}

/* date/time */

.date{

    color:#ffc9eb;

    margin-bottom:8px;

    font-size:1rem;
}

.time{

    color:#e8d8ff;

    font-size:1.15rem;
}

/* footer */

.footer{

    margin-top:22px;

    color:#d6b7e8;

    font-size:.85rem;
}

/* mobile */

@media(max-width:600px){

    .container{
        padding:28px;
    }

    .title{
        font-size:2.3rem;
    }

    .quote{
        font-size:1.1rem;
        min-height:120px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="title">

        tiny fruit bats carrying gentle thoughts ✨

    <div class="quote" id="quote"></div>

    <div class="date" id="date"></div>

    <div class="footer">
        pastel skies • sleepy bats • soft healing
    </div>

</div>

<script>

/*
Add more quotes anytime.
The site rotates automatically every day.
*/

const quotes = [

"Small steps still count as magic.",

"You survived every difficult day that once felt impossible.",

"Rest is not weakness. Even the moon takes phases.",

"Your softness is not something to apologize for.",

"The world is brighter because you are still in it.",

"You deserve gentle mornings and peaceful nights.",

"Even wilted flowers bloom again with care.",

"You are allowed to grow slowly.",

"Being different is part of your enchantment.",

"One calm breath can change an entire moment.",

"Not every storm comes to destroy you.",

"You are more loved than your mind lets you believe.",

"Some days surviving is the victory.",

"The universe has not given up on you.",

"Quiet people still leave loud magic behind.",

"You do not need permission to exist beautifully.",

"Healing is messy and still worth it.",

"There is tenderness waiting in your future.",

"You are not behind in life.",

"The stars would miss you if you disappeared.",

"Joy can exist beside sadness.",

"Your heart has carried you this far already.",

"Even tired souls deserve beautiful things.",

"Hope can be tiny and still powerful.",

"You are allowed to take up space.",

"Darkness does not erase your light.",

"The fact that you keep trying matters.",

"You are becoming someone your younger self needed.",

"Magic lives in staying alive another day.",

"The night sky never apologizes for being dark."

];

/* daily quote */

function getQuoteOfTheDay(){

    const today = new Date();

    const start = new Date(today.getFullYear(), 0, 0);

    const diff = today - start;

    const oneDay = 1000 * 60 * 60 * 24;

    const day = Math.floor(diff / oneDay);

    return quotes[day % quotes.length];
}

document.getElementById("quote").innerText =
    `"${getQuoteOfTheDay()}"`;

/* clock */

function updateTime(){

    const now = new Date();

    const dateOptions = {
        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    };

    document.getElementById("date").innerText =
        now.toLocaleDateString(undefined, dateOptions);

    document.getElementById("time").innerText =
        now.toLocaleTimeString([],{
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit'
        });
}

updateTime();

setInterval(updateTime,1000);

</script>

</body>
</html>
