<!DOCTYPE html>

<title>Little Bat Blessings</title>

<style>

/* =========================================================
   COLORS
========================================================= */

:root {
    --night: #0d0912;
    --deep-plum: #181020;
    --plum: #24162f;

    --lavender: #c8a8d8;
    --soft-lavender: #ddc5e8;

    --pink: #e3a9c7;
    --soft-pink: #f3c9dc;

    --white: #faeff8;
    --muted: #bba7c0;
}


/* =========================================================
   RESET / NO SCROLLING
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    overscroll-behavior: none;
}

body {
    min-height: 100dvh;
    width: 100vw;

    font-family: "Quicksand", sans-serif;

    color: var(--white);

    background:
        radial-gradient(
            ellipse at 50% -20%,
            #493052 0%,
            #281a34 35%,
            var(--night) 75%
        );

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    isolation: isolate;
}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

body::before {

    content: "";

    position: absolute;

    inset: -30%;

    z-index: -5;

    background:

        radial-gradient(
            circle at 20% 30%,
            rgba(206, 157, 224, .12),
            transparent 28%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(231, 158, 197, .10),
            transparent 30%
        );

    animation:
        backgroundDrift 20s ease-in-out infinite alternate;
}

@keyframes backgroundDrift {

    from {
        transform:
            translate(-2%, -2%)
            scale(1);
    }

    to {
        transform:
            translate(2%, 2%)
            scale(1.05);
    }
}


/* =========================================================
   MOON
========================================================= */

.moon {

    position: absolute;

    width: clamp(90px, 15vw, 180px);
    aspect-ratio: 1;

    top: 5%;
    right: 7%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #f9eafa,
            #d8b8e5 60%,
            #a984bb
        );

    box-shadow:
        0 0 30px rgba(225, 188, 240, .30),
        0 0 80px rgba(193, 140, 215, .12);

    opacity: .68;
}

.moon::after {

    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    background: var(--night);

    transform:
        translate(28%, -12%);
}


/* =========================================================
   SPARKLES
========================================================= */

.sparkle {

    position: absolute;

    color: #f3c8e6;

    font-size:
        clamp(10px, 1.5vw, 18px);

    opacity: .65;

    pointer-events: none;

    animation:
        sparkle 3s ease-in-out infinite;
}

@keyframes sparkle {

    0%,
    100% {
        opacity: .25;
        transform:
            scale(.7)
            rotate(0deg);
    }

    50% {
        opacity: 1;
        transform:
            scale(1.2)
            rotate(20deg);
    }
}


/* =========================================================
   FLYING BATS
========================================================= */

.flying-bat {

    position: absolute;

    width: 48px;
    height: 28px;

    opacity: .55;

    pointer-events: none;

    animation:
        flyAcross linear infinite;

    filter:
        drop-shadow(
            0 0 6px
            rgba(188, 135, 211, .35)
        );
}


/* Bat wings */

.flying-bat::before,
.flying-bat::after {

    content: "";

    position: absolute;

    top: 5px;

    width: 29px;
    height: 21px;

    background: #08060c;

    border-radius:
        70% 15% 70% 15%;
}

.flying-bat::before {

    left: 0;

    transform:
        rotate(20deg)
        skewY(12deg);
}

.flying-bat::after {

    right: 0;

    transform:
        rotate(-20deg)
        skewY(-12deg);
}


/* Bat body */

.bat-body {

    position: absolute;

    width: 13px;
    height: 22px;

    left: 50%;
    top: 4px;

    transform:
        translateX(-50%);

    background: #08060c;

    border-radius:
        45% 45% 50% 50%;

    z-index: 2;
}


/* Bat ears */

.bat-ear {

    position: absolute;

    width: 6px;
    height: 9px;

    top: 0;

    background: #08060c;

    z-index: 3;
}

.bat-ear.left {

    left: 17px;

    transform:
        rotate(-20deg);
}

.bat-ear.right {

    right: 17px;

    transform:
        rotate(20deg);
}


@keyframes flyAcross {

    from {

        transform:
            translateX(-120px)
            translateY(0)
            scale(.7);
    }

    50% {

        transform:
            translateX(50vw)
            translateY(-25px)
            scale(1);
    }

    to {

        transform:
            translateX(110vw)
            translateY(15px)
            scale(.8);
    }
}


/* =========================================================
   MAIN CARD
========================================================= */

.main {

    width: min(90vw, 720px);

    max-height: 82dvh;

    padding:
        clamp(24px, 5vw, 50px);

    border-radius: 32px;

    background:

            145deg,

        blur(14px);

        blur(14px);

    text-align: center;

    display: flex;

    z-index: 10;
}

.subtitle {

    margin-bottom:
        clamp(18px, 3vw, 30px);
}


/* =========================================================
   MAIN DAILY QUOTE
========================================================= */

.quote {

    font-family:
        "Cormorant Garamond",

    font-size:
        clamp(1.35rem, 4vw, 2.05rem);

    line-height:

    color:
        #fff3fb;

    text-shadow:
        0 0 12px

}

.quote::before {

    content: "“";

        1.6em;

    vertical-align:

    margin-right: 5px;
}

.quote::after {

    content: "”";

    color:

    font-size:
        1.6em;

    vertical-align:
        -.2em;

    margin-left: 5px;
}


/* =========================================================
   DATE / TIME
========================================================= */

.date {

    letter-spacing:
        .08em;
}

.time {

    margin-top: 4px;

    font-size: .75rem;

    color:

    letter-spacing:
        .05em;
}


/* =========================================================
   LITTLE CORNER BAT
========================================================= */

.bat-friend {

    position: fixed;

    left:

    bottom:

}

    }

    50% {

    }

.friend-body {

.friend-body::before,

.friend-body::after {

.ear {

.ear.left {

.ear.right {
    right: 17px;

.eye {

.eye.left {

.eye.right {
    right: 27px;
}

.smile {

    border-radius:

/* =========================================================

========================================================= */

.thought {

    position: absolute;

    left: 75px;

    width:

    padding:
        10px 13px;

    border-radius:

        box-shadow .25s ease,

    z-index: 5;

    pointer-events: auto;

    -webkit-tap-highlight-color:
        transparent;

.thought::after {

    content: "";

    position: absolute;

    left: 8px;
    bottom: -9px;

    width: 18px;
    height: 18px;

    background:
        rgba(242, 213, 244, .94);

    border-radius: 50%;

.thought:hover {

        0 7px 24px
        rgba(0, 0, 0, .28);
}

.thought:active {

    transform:
        scale(.96);
}

   HIDDEN DAILY ADVICE
========================================================= */

.advice {

.bat-friend.show-advice .advice {

    transform:

/* =========================================================
   CALCULATE DAY
========================================================= */

function getDayNumber() {

    const now =
        new Date();

    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    const start =
        new Date(
            startDate.getFullYear(),
            startDate.getMonth(),
            startDate.getDate()
        );

    const difference =
        today.getTime() -
        start.getTime();

    const day =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    return Math.max(0, day);
}


/* =========================================================
   LOAD TODAY'S TWO MESSAGES
========================================================= */

function updateDailyMessages() {

    const dayNumber =
        getDayNumber();


    /*
       Main quote

       One quote per calendar day.
    */

    const quoteIndex =
        dayNumber % quotes.length;


    document.getElementById(
        "dailyQuote"
    ).textContent =
        quotes[quoteIndex];


    /*
       Little bat advice

       Also one message per calendar day.

       It does NOT change when clicked.
       Clicking only reveals today's message.
    */

    const adviceIndex =
        dayNumber % advice.length;


    document.getElementById(
        "dailyAdvice"
    ).textContent =
        advice[adviceIndex];
}

========================================================= */

function updateDate() {

    const now =
        new Date();

    const dateText =
        now.toLocaleDateString(
            undefined,
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );

    document.getElementById(
        "date"

        dateText;
}

function updateTime() {

        new Date();

    const timeText =
        now.toLocaleTimeString(

                minute: "2-digit"
            }
        );
